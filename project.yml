name: Tony
options:
  bundleIdPrefix: com.mt81
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TonyCore:
    path: TonyCore
targets:
  TonyApp:
    type: application
    platform: iOS
    sources: [TonyApp]
    dependencies:
      - package: TonyCore
      - target: TonyWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mt81.tony
        PRODUCT_NAME: Tony
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: TonyApp/Info.plist
      properties:
        CFBundleDisplayName: Tony
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: TonyApp/TonyApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mt81.tony
    scheme: {}
  TonyWidgets:
    type: app-extension
    platform: iOS
    sources: [TonyWidgets]
    dependencies:
      - package: TonyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mt81.tony.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: TonyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tony
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TonyWidgets/TonyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mt81.tony
